################################################################################
# bucketplace fork: publish the Elasticsearch 8 connector (plain + SQL uber jar).
#
# Two outputs:
#   1. this repository's GitHub Packages Maven registry (needs a token with read:packages
#      to consume, even on a public repository);
#   2. on tag builds, the jars are attached to a GitHub Release of the same name, which can
#      be downloaded without any token:
#      https://github.com/<owner>/<repo>/releases/download/<tag>/<artifact>-<version>.jar
#      Downstream images pull the jars from this URL (pinned by sha256) at build time;
#      nothing is pushed anywhere else from here.
#
# Trigger: push a tag `v<connector>-<flink>` (e.g. v4.0.1-bp2-2.1) or run manually.
# The pom version is the source of truth for the artifact version; the tag is only
# the trigger. Flink version comes from the workflow input / default.
################################################################################
name: Publish to GitHub Packages
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      flink_version:
        description: Flink version to build against (-Dflink.version)
        required: true
        default: '2.1.3'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release on tag builds
      packages: write
    env:
      FLINK_VERSION: ${{ github.event.inputs.flink_version || '2.1.3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # writes ~/.m2/settings.xml with <server><id>github</id> using GITHUB_ACTOR / GITHUB_TOKEN
          server-id: github

      - name: Build and verify (unit tests only; ITCases need Docker and run in push_pr.yml)
        run: >
          mvn -B -ntp
          -Dflink.version=${FLINK_VERSION}
          -Drat.skip=true -Dmaven.javadoc.skip=true
          -DskipTests
          -pl flink-connector-elasticsearch8,flink-sql-connector-elasticsearch8 -am
          verify

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp
          -Dflink.version=${FLINK_VERSION}
          -Drat.skip=true -Dmaven.javadoc.skip=true
          -DskipTests -Dgpg.skip=true
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          -pl flink-connector-elasticsearch8,flink-sql-connector-elasticsearch8 -am
          deploy

      - name: Attach jars to a GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(ls flink-connector-elasticsearch8/target/flink-connector-elasticsearch8-*.jar \
                     flink-sql-connector-elasticsearch8/target/flink-sql-connector-elasticsearch8-*.jar \
                  | grep -v -e '/original-' -e '-tests.jar')
          echo "$files"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "$GITHUB_REF_NAME" \
              --notes "Elasticsearch 8 connector built against Flink ${FLINK_VERSION}. See BUCKETPLACE.md for usage and caveats."
          fi
