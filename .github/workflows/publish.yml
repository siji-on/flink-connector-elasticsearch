################################################################################
# bucketplace fork: publish the Elasticsearch 8 connector (plain + SQL uber jar)
# to this repository's GitHub Packages Maven registry.
#
# Trigger: push a tag `v<connector>-<flink>` (e.g. v4.0.1-bp1-2.1) or run manually.
# The pom version is the source of truth for the artifact version; the tag is only
# the trigger. Flink version comes from the workflow input / default.
################################################################################
name: Publish to GitHub Packages
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      flink_version:
        description: Flink version to build against (-Dflink.version)
        required: true
        default: '2.1.3'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FLINK_VERSION: ${{ github.event.inputs.flink_version || '2.1.3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # writes ~/.m2/settings.xml with <server><id>github</id> using GITHUB_ACTOR / GITHUB_TOKEN
          server-id: github

      - name: Build and verify (unit tests only; ITCases need Docker and run in push_pr.yml)
        run: >
          mvn -B -ntp
          -Dflink.version=${FLINK_VERSION}
          -Drat.skip=true -Dmaven.javadoc.skip=true
          -DskipTests
          -pl flink-connector-elasticsearch8,flink-sql-connector-elasticsearch8 -am
          verify

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp
          -Dflink.version=${FLINK_VERSION}
          -Drat.skip=true -Dmaven.javadoc.skip=true
          -DskipTests -Dgpg.skip=true
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          -pl flink-connector-elasticsearch8,flink-sql-connector-elasticsearch8 -am
          deploy
